  if (str.includes('T') && str.includes('Z')) {
    const d = new Date(str);
    if (!isNaN(d.getTime())) {
      const yyyy = d.getFullYear();
      const mm = String(d.getMonth() + 1).padStart(2, '0');
      const dd = String(d.getDate()).padStart(2, '0');
      str = `${yyyy}-${mm}-${dd}`;
    }
  } else {
    str = str.split('T')[0]; // กรณีส่งมาเป็นแค่ YYYY-MM-DD
  }

  // จัดการแปลงปี พ.ศ. ให้เป็น ค.ศ.
  const parts = str.split('-');
  if (parts.length === 3) {
    let y = parseInt(parts[0], 10);
    if (isNaN(y)) return str;
    if (y >= 2500 && y <= 2600) y = y - 543;else if (y >= 1950 && y <= 1999) y = 2500 + (y - 1900) - 543;else if (y >= 2030 && y <= 2099) y = 2500 + (y - 2000) - 543;
    return `${y}-${parts[1]}-${parts[2]}`;
  }
  return str;
};
const formatDisplayDate = dateStr => {
  if (!dateStr) return '-';
  try {
    const d = new Date(normalizeDate(dateStr));
    if (isNaN(d.getTime())) return '-';
    return d.toLocaleDateString('th-TH');
  } catch (e) {
    return '-';
  }
};
const getFiscalYear = dateString => {
  if (!dateString) return '';
  const d = new Date(dateString);
  if (isNaN(d.getTime())) return '';
  let year = d.getFullYear();
  if (year < 2500) year += 543;
  return d.getMonth() + 1 >= 10 ? (year + 1).toString() : year.toString();
};
